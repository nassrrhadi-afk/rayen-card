<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rayen — Contact Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2A1B3D;
    --card: #FFFDF7;
    --pink: #FF5C8A;
    --orange: #FF9F45;
    --yellow: #FFD23F;
    --teal: #2EC4B6;
    --purple: #7B61FF;
    --line: rgba(42,27,61,0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 15% 20%, var(--pink) 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, var(--yellow) 0%, transparent 40%),
      radial-gradient(circle at 20% 85%, var(--teal) 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, var(--purple) 0%, transparent 45%),
      #FFF6E9;
    font-family: 'Nunito', sans-serif;
    padding: 32px;
  }

  .card {
    width: 340px;
    background: var(--card);
    color: var(--ink);
    border-radius: 28px;
    padding: 36px 30px 30px;
    position: relative;
    box-shadow: 0 24px 48px -12px rgba(42,27,61,0.35);
    border: 4px solid var(--ink);
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: -40px;
    right: -40px;
    width: 130px;
    height: 130px;
    background: var(--yellow);
    border-radius: 50%;
    z-index: 0;
  }

  .card::after {
    content: "";
    position: absolute;
    bottom: -50px;
    left: -30px;
    width: 110px;
    height: 110px;
    background: var(--teal);
    border-radius: 50%;
    z-index: 0;
  }

  .id-row, .header-row, .divider, .number-label, .number, .contacts {
    position: relative;
    z-index: 1;
  }

  .id-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--purple);
    margin-bottom: 24px;
  }

  .photo-wrap {
    width: 76px;
    height: 76px;
    border-radius: 20px;
    overflow: hidden;
    border: 3px solid var(--ink);
    flex-shrink: 0;
    box-shadow: 4px 4px 0 var(--pink);
  }

  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .header-row {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 28px;
  }

  .name-block { min-width: 0; }

  .name {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 32px;
    line-height: 1.05;
    margin: 0 0 4px;
    color: var(--ink);
  }

  .nickname {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--pink);
    margin: 0;
  }

  .divider {
    height: 3px;
    background: repeating-linear-gradient(90deg, var(--purple) 0 8px, transparent 8px 14px);
    margin: 0 0 20px;
    border-radius: 2px;
  }

  .number-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--teal);
    margin-bottom: 6px;
  }

  .number {
    font-family: 'Baloo 2', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.02em;
  }

  .contacts {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }

  .contact-row .tag {
    background: var(--purple);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 4px 10px;
    border-radius: 999px;
  }

  .contact-row a {
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 2px solid var(--yellow);
    word-break: break-all;
  }
</style>
</head>
